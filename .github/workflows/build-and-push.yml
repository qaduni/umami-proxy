name: Build Docker Image & Update Dokploy Template

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update README with Dokploy Base64
        run: |
          python3 -c '
          import json, base64, re

          with open("docker-compose.yml") as f1, open("template.toml") as f2:
              data = {"compose": f1.read(), "config": f2.read()}
              b64_str = base64.b64encode(json.dumps(data).encode()).decode()

          with open("README.md", "r") as f:
              readme = f.read()

          pattern = r"(<!-- DOKPLOY_BASE64_START -->)(.*?)(<!-- DOKPLOY_BASE64_END -->)"
          replacement = f"\\1\\n```text\\n{b64_str}\\n```\\n\\3"
          
          updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(updated_readme)
          '

      - name: Commit Updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in README.md to commit."
          else
            git commit -m "docs: auto-update Dokploy Base64 template in README"
            git push
          fi